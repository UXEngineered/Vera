# fly.toml app configuration file generated for vera-qio5gg on 2026-10-06T11:21:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vera-qio5gg'
primary_region = 'lhr'

[build]

[env]
  VERA_DAILY_CAP = '300'
  VERA_RATE_LIMIT = '6'
  VERA_RATE_WINDOW_MIN = '60'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 60
    soft_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
